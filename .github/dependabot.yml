# Keeps pinned GitHub Actions, container base images and every package ecosystem current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /code/ai_models
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web-frontend
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
  - package-ecosystem: nuget
    directories:
      - /code
      - /mobile-frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule:
      interval: weekly
