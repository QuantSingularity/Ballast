name: Ballast CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ai_models/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - run: scripts/setup_environment.sh
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: ./scripts/lint_code.sh

  ai-models:
    name: AI models (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/ai_models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ai_models/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest

  backend:
    name: Backend (with the real model service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ai_models/requirements.txt
      - run: pip install -r code/ai_models/requirements.txt
      - name: Build
        run: dotnet build code/Ballast.slnx -c Release
      - name: Backend unit and API integration tests
        run: dotnet code/backend/tests/bin/Release/net10.0/Ballast.Backend.Tests.dll

  smoke:
    name: API smoke test
    runs-on: ubuntu-latest
    needs: [backend, ai-models]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r code/ai_models/requirements.txt
      - run: ./scripts/smoke_test.sh

  mobile-ui:
    name: Mobile UI library and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r code/ai_models/requirements.txt
      - run: dotnet build mobile-frontend/Ballast.Mobile.slnx -c Release
      - run: dotnet mobile-frontend/Ballast.Mobile.Tests/bin/Release/net10.0/Ballast.Mobile.Tests.dll

  web-frontend:
    name: Web frontend test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npm run build

  maui-android:
    name: MAUI host build (Android)
    runs-on: ubuntu-latest
    # The MAUI host was written without access to the MAUI workloads and has not been compiled yet.
    # It is advisory until it has gone green once; then remove continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-android
      - run: dotnet build mobile-frontend/Ballast.Mobile.App/Ballast.Mobile.App.csproj -f net10.0-android -c Release

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: ./infrastructure/validate.sh
      - name: Build images (not pushed)
        run: |
          docker build -f infrastructure/docker/Dockerfile.backend -t ballast-backend:ci .
          docker build -f infrastructure/docker/Dockerfile.ai -t ballast-ai:ci .
          docker build -f infrastructure/docker/Dockerfile.frontend -t ballast-web:ci .

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_links.py
