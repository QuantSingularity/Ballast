name: Ballast CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Third-party actions are pinned to full commit SHAs (the tag is in the trailing comment). Dependabot keeps them current.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  backend:
    name: Backend (with the real model service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ai_models/requirements.txt
      - run: pip install -r code/ai_models/requirements.txt
      - name: Build
        run: dotnet build code/Ballast.slnx -c Release
      - name: Backend unit and API integration tests
        run: dotnet code/backend/tests/bin/Release/net10.0/Ballast.Backend.Tests.dll

  mobile-ui:
    name: Mobile UI library and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r code/ai_models/requirements.txt
      - run: dotnet build mobile-frontend/Ballast.Mobile.slnx -c Release
      - run: dotnet mobile-frontend/Ballast.Mobile.Tests/bin/Release/net10.0/Ballast.Mobile.Tests.dll

  web-frontend:
    name: Web frontend test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npm run build

  maui-android:
    name: MAUI host build (Android)
    runs-on: ubuntu-latest
    # The MAUI host was written without access to the MAUI workloads and has not been compiled yet.
    # It is advisory until it has gone green once; then remove continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-android
      - run: dotnet build mobile-frontend/Ballast.Mobile.App/Ballast.Mobile.App.csproj -f net10.0-android -c Release

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: pip install pyyaml
      - run: bash infrastructure/validate.sh
      - name: Build images (not pushed)
        run: |
          docker build -f infrastructure/docker/Dockerfile.backend -t ballast-backend:ci .
          docker build -f infrastructure/docker/Dockerfile.ai -t ballast-ai:ci .
          docker build -f infrastructure/docker/Dockerfile.frontend -t ballast-web:ci .

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - name: Python (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r code/ai_models/requirements.txt
      - name: Web (npm audit, production dependencies)
        working-directory: web-frontend
        run: npm audit --omit=dev --audit-level=high
      - name: .NET (NuGet advisories, including transitive packages)
        run: |
          for sln in code/Ballast.slnx mobile-frontend/Ballast.Mobile.slnx; do
            dotnet restore "$sln"
            dotnet list "$sln" package --vulnerable --include-transitive 2>&1 | tee audit.txt
            if grep -q "has the following vulnerable packages" audit.txt; then
              echo "Vulnerable NuGet packages found in $sln" >&2
              exit 1
            fi
          done

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: python3 scripts/check_links.py
