name: ballast

services:
  ai:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.ai
    restart: unless-stopped
    expose:
      - "8000"

  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.backend
    environment:
      BALLAST_ENV: ${BALLAST_ENV:-development}
      BALLAST_SECRET_KEY: ${BALLAST_SECRET_KEY:?Set BALLAST_SECRET_KEY (openssl rand -hex 32)}
      BALLAST_BASE_CURRENCY: ${BALLAST_BASE_CURRENCY:-USD}
      BALLAST_CORS_ORIGINS: ${BALLAST_CORS_ORIGINS:-http://localhost:4200}
      BALLAST_DATA_PATH: /data
      BALLAST_AI_SERVICE_URL: http://ai:8000
      BALLAST_TRUST_PROXY: "true"
    depends_on:
      - ai
    volumes:
      - ballast-data:/data
    restart: unless-stopped
    expose:
      - "8080"

  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "4200:8080"
    restart: unless-stopped

volumes:
  ballast-data:
