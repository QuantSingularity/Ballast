# Not part of the kustomization. Create the real secret out of band:
#   kubectl -n ballast create secret generic ballast-secrets --from-literal=BALLAST_SECRET_KEY="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: ballast-secrets
  namespace: ballast
type: Opaque
stringData:
  BALLAST_SECRET_KEY: replace-with-at-least-32-random-characters
