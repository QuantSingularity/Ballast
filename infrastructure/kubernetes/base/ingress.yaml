apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ballast
  namespace: ballast
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["ballast.example.com"]
      secretName: ballast-tls
  rules:
    - host: ballast.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
