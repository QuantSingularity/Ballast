apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-only-from-web
  namespace: ballast
spec:
  podSelector:
    matchLabels:
      app: ballast-backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ballast-web
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-only-from-backend
  namespace: ballast
spec:
  podSelector:
    matchLabels:
      app: ballast-ai
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ballast-backend
      ports:
        - port: 8000
