apiVersion: apps/v1
kind: Deployment
metadata:
  name: ballast-web
  namespace: ballast
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ballast-web
  template:
    metadata:
      labels:
        app: ballast-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/quantsingularity/ballast-web:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ballast
spec:
  selector:
    app: ballast-web
  ports:
    - port: 80
      targetPort: 8080
