apiVersion: v1
kind: ConfigMap
metadata:
  name: ballast-config
  namespace: ballast
data:
  BALLAST_ENV: production
  BALLAST_BASE_CURRENCY: USD
  BALLAST_DATA_PATH: /data
  BALLAST_TRUST_PROXY: "true"
  BALLAST_CORS_ORIGINS: https://ballast.example.com
  BALLAST_DUAL_APPROVAL_THRESHOLD: "50000"
  BALLAST_MAX_BANK_CONCENTRATION: "0.35"
  BALLAST_MIN_LIQUIDITY_BUFFER: "10000000"
