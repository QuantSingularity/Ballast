apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: ballast-config
    patch: |-
      - op: replace
        path: /data/BALLAST_ENV
        value: staging
  - target:
      kind: Deployment
      name: ballast-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
